[pytest]
# Pytest configuration for Noda

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=backend
    --cov-report=html:htmlcov
    --cov-report=term-missing
    --cov-report=xml
    --cov-branch
    --maxfail=3
    -p no:warnings

# Coverage settings
[coverage:run]
branch = True
source = backend
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */site-packages/*
    */.venv/*
    */venv/*
    */node_modules/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
    @abc.abstractmethod

[coverage:html]
directory = htmlcov

# Test markers
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    rag: RAG system tests
    qdrant: Qdrant service tests
    model: Model management tests
    api: API endpoint tests
    pipeline: Training pipeline tests

# Minimum Python version
minversion = 3.8

# Test paths
testpaths = tests
