[pytest]
# Pytest configuration for Noda

# Test discovery paths
testpaths = tests backend

# Test file patterns
python_files = test_*.py *_test.py

# Test class and function patterns
python_classes = Test* *Tests
python_functions = test_*

# Minimum pytest version
minversion = 7.0

# Default options
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    --color=yes
    # Coverage is requested explicitly by the test runner.
    # --cov=backend
    # --cov-report=term-missing
    # --cov-report=html:htmlcov
    # --cov-report=json

# Test markers
markers =
    unit: Fast isolated unit tests
    integration: Integration tests with external dependency boundaries
    api: API endpoint tests
    rag: RAG model tests
    slow: Slow tests
    smoke: Basic functionality smoke tests

# Ignored directories
norecursedirs =
    .git
    .venv
    node_modules
    frontend
    __pycache__
    *.egg-info
    dist
    build
    .pytest_cache
    htmlcov

# Console output
console_output_style = progress

# Logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Warning filters
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
